<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>~/nav</title>
  <style>
    /* ===== 程序员风格 · 多终端适配 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      /* 移动端字体自适应 */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background: #0d1117;
      font-family: 'SF Mono', 'Consolas', 'Monaco', 'Menlo', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      /* 安全区域适配（刘海屏/底部横条） */
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      line-height: 1.6;
      color: #c9d1d9;
      /* 防止移动端横向滚动 */
      overflow-x: hidden;
    }

    /* 终端窗口 —— 流式宽度，最大 640px */
    .terminal {
      width: 100%;
      max-width: 640px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
      /* 大屏幕增加轻微阴影 */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* 终端标题栏 */
    .title-bar {
      display: flex;
      align-items: center;
      padding: 0.6rem 1rem;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      gap: 0.5rem;
      /* 防止标题过长挤压圆点 */
      flex-wrap: nowrap;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .title-bar-text {
      margin-left: 0.5rem;
      font-size: 0.75rem;
      color: #8b949e;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 终端主体 —— 使用 clamp 让内边距随屏幕缩放 */
    .terminal-body {
      padding: clamp(1rem, 4vw, 1.8rem);
    }

    /* 命令行提示符 */
    .prompt-line {
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      color: #8b949e;
      margin-bottom: 1.2rem;
      word-break: break-all;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.15rem;
    }

    .prompt-user { color: #7ee787; }
    .prompt-path { color: #79c0ff; }
    .prompt-symbol { color: #8b949e; margin: 0 0.2rem; }
    .prompt-cmd { color: #c9d1d9; }

    /* 导航列表 —— 模拟 ls -la 输出 */
    .nav-list {
      list-style: none;
      margin-bottom: 1.5rem;
    }

    .nav-item {
      display: flex;
      align-items: baseline;
      font-size: clamp(0.85rem, 2.8vw, 0.95rem);
      padding: 0.4rem 0;
      gap: 0.6rem;
      /* 防止长链接换行错乱 */
      flex-wrap: wrap;
    }

    /* 权限位 */
    .perm {
      color: #8b949e;
      font-size: clamp(0.65rem, 2.2vw, 0.8rem);
      flex-shrink: 0;
      letter-spacing: -1px;
    }

    /* 链接 */
    .nav-item a {
      color: #58a6ff;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: color 0.1s;
      /* 触控区域 */
      padding: 0.1rem 0;
      word-break: break-word;
    }

    .nav-item a:hover,
    .nav-item a:active {
      color: #79c0ff;
      text-decoration: underline;
    }

    /* 注释 */
    .comment {
      color: #6e7681;
      font-size: clamp(0.65rem, 2.2vw, 0.8rem);
      font-style: italic;
      /* 移动端右对齐或换行时保持整洁 */
      margin-left: auto;
      padding-left: 0.5rem;
      white-space: nowrap;
    }

    /* 在窄屏时注释换行，避免挤压链接 */
    @media (max-width: 380px) {
      .nav-item {
        flex-wrap: wrap;
      }
      .comment {
        margin-left: 0;
        padding-left: 0;
        width: 100%;
        white-space: normal;
        text-align: right;
      }
    }

    /* 光标行 */
    .cursor-line {
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      color: #8b949e;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.15rem;
      margin-top: 0.5rem;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background: #58a6ff;
      margin-left: 0.3rem;
      animation: blink 1.2s step-end infinite;
      /* 防止光标在移动端过大 */
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 页脚 */
    .footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      color: #484f58;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .footer a {
      color: #484f58;
      text-decoration: none;
      transition: color 0.1s;
    }

    .footer a:hover,
    .footer a:active {
      color: #8b949e;
    }

    /* ===== 平板/桌面微调 ===== */
    @media (min-width: 768px) {
      .nav-item {
        padding: 0.5rem 0;
      }
      .perm {
        letter-spacing: 0;
      }
    }

    /* ===== 超小屏（≤360px）极致压缩 ===== */
    @media (max-width: 360px) {
      .terminal-body {
        padding: 0.9rem;
      }
      .nav-item {
        font-size: 0.8rem;
        gap: 0.4rem;
      }
      .perm {
        font-size: 0.6rem;
      }
      .comment {
        font-size: 0.6rem;
      }
    }

    /* ===== 横屏手机优化 ===== */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        align-items: flex-start;
        padding-top: 1rem;
        padding-bottom: 1rem;
      }
      .terminal-body {
        padding: 1rem;
      }
      .nav-item {
        padding: 0.25rem 0;
      }
      .prompt-line {
        margin-bottom: 0.8rem;
      }
      .footer {
        margin-top: 1rem;
        padding-top: 0.7rem;
      }
    }

    /* ===== 无障碍：减少动画 ===== */
    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
        opacity: 1;
      }
      * {
        transition: none !important;
      }
    }

    /* ===== 高对比度/亮色模式（可选兜底，保持深色优先） ===== */
    @media (prefers-color-scheme: light) {
      /* 依然保持程序员深色终端风格，不切换，但可调整少许亮度 */
      body {
        background: #0d1117;
      }
    }
  </style>
</head>
<body>
  <div class="terminal">
    <!-- 终端标题栏 -->
    <div class="title-bar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title-bar-text">~/nav — zsh</span>
    </div>

    <!-- 终端主体 -->
    <div class="terminal-body">
      <!-- 命令行提示符 -->
      <div class="prompt-line">
        <span class="prompt-user">user@dev</span>
        <span class="prompt-symbol">:</span>
        <span class="prompt-path">~/nav</span>
        <span class="prompt-symbol">$</span>
        <span class="prompt-cmd">ls -la</span>
      </div>

      <!-- 导航列表 -->
      <ul class="nav-list">
        <li class="nav-item">
          <span class="perm">drwxr-xr-x</span>
          <a href="#" target="_blank" rel="noopener"></a>
          <span class="comment"># home</span>
        </li>
        <li class="nav-item">
          <span class="perm">drwxr-xr-x</span>
          <a href="#" target="_blank" rel="noopener">博客</a>
          <span class="comment"># blog</span>
        </li>
        <li class="nav-item">
          <span class="perm">drwxr-xr-x</span>
          <a href="#" target="_blank" rel="noopener">相册</a>
          <span class="comment"># photos</span>
        </li>
        <li class="nav-item">
          <span class="perm">drwxr-xr-x</span>
          <a href="#" target="_blank" rel="noopener">笔记</a>
          <span class="comment"># notes</span>
        </li>
        <li class="nav-item">
          <span class="perm">drwxr-xr-x</span>
          <a href="#" target="_blank" rel="noopener">书签</a>
          <span class="comment"># bookmarks</span>
        </li>
        <li class="nav-item">
          <span class="perm">drwxr-xr-x</span>
          <a href="#" target="_blank" rel="noopener">关于</a>
          <span class="comment"># about</span>
        </li>
      </ul>

      <!-- 新命令行 + 闪烁光标 -->
      <div class="cursor-line">
        <span class="prompt-user">user@dev</span>
        <span class="prompt-symbol">:</span>
        <span class="prompt-path">~/nav</span>
        <span class="prompt-symbol">$</span>
        <span class="cursor"></span>
      </div>

      <!-- 页脚 -->
      <div class="footer">
        <span>© 2025</span>
        <span><a href="#">vim nav</a></span>
      </div>
    </div>
  </div>
</body>
</html>
