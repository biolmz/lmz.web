<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMZ · 导航</title>
  <style>
    /* 全局重置与极简基调 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f9f8f6;   /* 温润米白，像旧书页 */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      line-height: 1.5;
      color: #2c2c2c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      margin: 0;
    }

    /* 主容器：极简卡片，轻微纸张感 */
    .nav-wrapper {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.03);
      padding: 3rem 2.5rem;
      transition: all 0.2s ease;
    }

    /* 院系风格的标题区 */
    .academic-header {
      text-align: center;
      margin-bottom: 2.8rem;
      border-bottom: 1px solid #eae9e4;
      padding-bottom: 1.8rem;
    }

    .academic-header h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #1e1e1e;
      margin-bottom: 0.4rem;
      font-feature-settings: "liga" 1;
    }

    .academic-header .subhead {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #8b8b84;
      font-weight: 400;
      word-spacing: 0.1em;
    }

    /* 导航链接列表——极简网格，学院气质 */
    .nav-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    /* 每个链接：干净、留白、微妙的交互 */
    .nav-item {
      display: block;
      text-decoration: none;
      color: #2c2c2c;
      padding: 1.1rem 1.25rem;
      border-radius: 14px;
      background-color: #ffffff;
      border: 1px solid #eeede9;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
      font-weight: 450;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: -0.01em;
    }

    /* 左侧：网站名称 + 简约标记 */
    .nav-left {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .site-name {
      font-size: 1.1rem;
      font-weight: 500;
      color: #1e1e1e;
    }

    .site-desc {
      font-size: 0.8rem;
      color: #9a9a93;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* 右侧：箭头 / 小圆点，传递方向感 */
    .nav-arrow {
      color: #b9b9b0;
      font-size: 1.1rem;
      transition: transform 0.2s, color 0.2s;
      line-height: 1;
      font-weight: 300;
      margin-left: 0.5rem;
    }

    /* 悬停：清爽的学术反馈 */
    .nav-item:hover {
      background-color: #fcfcfa;
      border-color: #dad9d2;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .nav-item:hover .nav-arrow {
      color: #5b5b55;
      transform: translateX(3px);
    }

    /* 极简脚注 — 像论文页脚 */
    .academic-footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #b1b1a9;
      letter-spacing: 0.02em;
      border-top: 1px solid #f0efea;
      padding-top: 1.8rem;
    }

    .academic-footer span {
      display: inline-block;
      font-weight: 350;
    }

    /* 小屏幕微调 */
    @media (max-width: 480px) {
      body {
        padding: 1.25rem;
      }

      .nav-wrapper {
        padding: 2rem 1.25rem;
        border-radius: 20px;
      }

      .academic-header h1 {
        font-size: 1.7rem;
      }

      .nav-item {
        padding: 1rem 1rem;
        flex-wrap: wrap;
      }

      .site-name {
        font-size: 1rem;
      }

      .site-desc {
        font-size: 0.75rem;
      }
    }

    /* 优雅的焦点可访问性 */
    .nav-item:focus-visible {
      outline: 2px solid #a6a69c;
      outline-offset: 2px;
      border-color: transparent;
    }
  </style>
</head>
<body>
  <div class="nav-wrapper">
    <!-- 学院风页眉 -->
    <header class="academic-header">
      <h1>导航</h1>
      <div class="subhead">websites</div>
    </header>

    <!-- 导航卡片 —— 将“自己的网站”放在这里（可自行替换链接和文字） -->
    <nav class="nav-grid" aria-label="个人网站导航">
      

      <a href="https://biolmz.cn" class="nav-item" target="_blank" rel="noopener noreferrer">
        <div class="nav-left">
          <span class="site-name">主站</span>
        </div>
        <span class="nav-arrow" aria-hidden="true">↗</span>
      </a>

  
      <a href="https://biolmz.cn/content" class="nav-item" target="_blank" rel="noopener noreferrer">
        <div class="nav-left">
          <span class="site-name">总导航</span>
  
        </div>
        <span class="nav-arrow" aria-hidden="true">↗</span>
      </a>


      <a href="https://lab.biolmz.cn" class="nav-item" target="_blank" rel="noopener noreferrer">
        <div class="nav-left">
          <span class="site-name">课题网站</span>

        </div>
        <span class="nav-arrow" aria-hidden="true">↗</span>
      </a>

   
      <a href="http://47.104.107.67:8090/" class="nav-item" target="_blank" rel="noopener noreferrer">
        <div class="nav-left">
          <span class="site-name">课题管理网站</span>
          <span class="site-desc">内部管理系统</span>
        </div>
        <span class="nav-arrow" aria-hidden="true">↗</span>
      </a>

  
      <a href="http://47.104.107.67:3000/" class="nav-item" target="_blank" rel="noopener noreferrer">
        <div class="nav-left">
          <span class="site-name">个人云盘</span>
          <span class="site-desc">个人云盘系统</span>
        </div>
        <span class="nav-arrow" aria-hidden="true">↗</span>
      </a>

      <!-- 可以继续添加更多网站，保持极简。 
           注释掉的部分作为样式参考，可自行取消注释并修改链接 -->
      <!--
      <a href="https://another.your-website.com" class="nav-item" target="_blank" rel="noopener noreferrer">
        <div class="nav-left">
          <span class="site-name">摄影集</span>
          <span class="site-desc">视觉记录</span>
        </div>
        <span class="nav-arrow" aria-hidden="true">↗</span>
      </a>
      -->
    </nav>

    <!-- 学院风脚注 — 可写一句座右铭或年份 -->
    <footer class="academic-footer">
      <span>© 2025 · 保持好奇</span>
    </footer>
  </div>
</body>
</html>
